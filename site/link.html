<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gerar link de reserva · Casa Mar de Mel</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230f4c5c%27/%3E%3Cpath d=%27M5 20c3-3 5-3 8 0s5 3 8 0 5-3 6-1%27 stroke=%27%23e3a33b%27 stroke-width=%273%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&family=Gloock&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topo">
    <div class="envelope"><a class="marca" href="index.html">Casa Mar de Mel</a><span style="color:var(--tinta-suave)">Uso da família</span></div>
  </header>

  <section class="secao">
    <div class="envelope">
      <h2>Gerar link de reserva</h2>
      <p class="lead">Depois de confirmar a disponibilidade com o cliente, preencha o período e mande o link. As datas chegam travadas no formulário dele, e o contrato já sai com o valor certo.</p>
      <div class="orc">
        <form class="campos" id="form-link" novalidate>
          <div class="campos-2">
            <label for="l-entrada">Entrada<input type="date" id="l-entrada" required></label>
            <label for="l-saida">Saída<input type="date" id="l-saida" required></label>
          </div>
          <div class="campos-2">
            <label for="l-adultos">Adultos<input type="number" id="l-adultos" min="1" max="12" value="4"></label>
            <label for="l-criancas">Crianças<input type="number" id="l-criancas" min="0" max="11" value="2"></label>
          </div>
          <label for="l-desconto">Desconto em reais<span class="ajuda">Opcional. Sai discriminado no contrato.</span><input type="number" id="l-desconto" min="0" step="10" value="0"></label>
          <label for="l-telefone">WhatsApp do cliente<span class="ajuda">Opcional. Com DDD, para abrir a conversa já com a mensagem.</span><input type="tel" id="l-telefone" placeholder="83 99999-0000"></label>
        </form>
        <div class="recibo" id="saida-link" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
  <script>
  (function () {
    const { C, money, orcamento, iso, br, addDays, esc, parseISO } = MDM;
    MDM.faixaTeste();
    const $ = (id) => document.getElementById(id);
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    const sexta = addDays(hoje, ((5 - hoje.getDay() + 7) % 7) || 7);
    $("l-entrada").value = iso(sexta); $("l-saida").value = iso(addDays(sexta, 3));

    function gerar() {
      const e = $("l-entrada").value, s = $("l-saida").value;
      const a = +$("l-adultos").value || 1, c = +$("l-criancas").value || 0, desc = +$("l-desconto").value || 0;
      const r = orcamento({ entrada: e, saida: s, hospedes: a + c, desconto: desc });
      const out = $("saida-link");
      if (r.erro) { out.innerHTML = `<p class="erro">${esc(r.erro)}</p>`; return; }
      const base = new URL("reserva.html", location.href);
      base.search = new URLSearchParams({ entrada: e, saida: s, adultos: a, criancas: c, ...(desc ? { desconto: desc } : {}) }).toString();
      const link = base.toString();
      const msg = `Olá! Segue o link para concluir sua reserva na ${C.nome} (${br(r.entrada)} a ${br(r.saida)}, total ${money(r.total)}). É só preencher seus dados, enviar os documentos e assinar o contrato pelo gov.br:\n${link}`;
      const tel = $("l-telefone").value.replace(/\D/g, "");
      const zapUrl = `https://wa.me/${tel ? (tel.length <= 11 ? "55" + tel : tel) : ""}?text=${encodeURIComponent(msg)}`;
      out.innerHTML = `
        <p class="recibo-periodo">${r.noites} diárias · ${a + c} pessoas</p>
        ${r.grupos.map((g) => `<div class="recibo-linha"><span>${g.noites} × ${money(g.diaria)} (${esc(g.nome)})</span><span>${money(g.subtotal)}</span></div>`).join("")}
        <div class="recibo-linha"><span>Limpeza final</span><span>${money(r.limpeza)}</span></div>
        ${r.desconto ? `<div class="recibo-linha"><span>Desconto</span><span>− ${money(r.desconto)}</span></div>` : ""}
        <div class="recibo-total"><span>Total</span><strong>${money(r.total)}</strong></div>
        ${r.abaixoDoMinimo ? `<p class="aviso">Abaixo do mínimo de ${r.minimo} diárias deste período. O link funciona mesmo assim.</p>` : ""}
        <p class="obs">Link para o cliente:</p>
        <p class="link-gerado" id="link-txt">${esc(link)}</p>
        <button class="btn btn-linha" type="button" id="btn-copiar">Copiar link</button>
        <a class="btn btn-zap" href="${zapUrl}" target="_blank" rel="noopener">Mandar pelo WhatsApp</a>`;
      $("btn-copiar").onclick = async () => {
        try { await navigator.clipboard.writeText(link); $("btn-copiar").textContent = "Link copiado"; }
        catch { const sel = getSelection(); const rg = document.createRange(); rg.selectNodeContents($("link-txt")); sel.removeAllRanges(); sel.addRange(rg); $("btn-copiar").textContent = "Selecionado: copie com o menu"; }
      };
    }
    $("form-link").addEventListener("input", gerar);
    gerar();
  })();
  </script>
</body>
</html>
