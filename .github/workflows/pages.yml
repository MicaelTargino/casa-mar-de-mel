name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # O GitHub Pages deixa o navegador guardar os arquivos por 10 min.
      # Marcar CSS/JS com a versão do commit faz cada publicação buscar a cópia nova.
      - name: Versiona CSS e JS
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(assets/[a-z]+\.(js|css))\"#\1?v=$V\"#g" site/*.html
          grep -c "?v=$V" site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
